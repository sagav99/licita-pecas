name: Atualizar radar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PNCP_MODALITY_CODES: 6,7,8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Coletar oportunidades do PNCP
        run: npm run pncp:collect
      - name: Atualizar matches por organização
        run: npm run matches:generate
